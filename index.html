<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="css/style.css"
</head>
<body>

    <main>

        <h1>Descubra a sua</h1>
        <h2>média anual</h2>

        <label for="nota1">Digite a primeira nota</label> <br>
        <input name="nota1" type="number" id="nota1" placeholder="Primeira nota"> <br>

        <label for="nota2">Digite a segunda nota</label> <br>
        <input name="nota2" type="number" id="nota2" placeholder="Segunda nota"> <br>

        <label for="nota3">Digite a terceira nota</label> <br>
        <input name="nota3" type="number" id="nota3" placeholder="Terceira nota"> <br>

        <button id="btn-calcular">Calcular</button>

        <p id="resultado"></p>

    </main>

    <script src="js/func.js"></script>
    
</body>
</html>
